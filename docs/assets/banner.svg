    <radialGradient id="glow" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#20c997" stop-opacity=".35"/><stop offset="1" stop-color="#20c997" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63e6be"/><stop offset="1" stop-color="#12b886"/></linearGradient>
